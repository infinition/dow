name: Release

on:
  push:
    tags: [ 'v*' ]
  # Lets the macOS app be rebuilt for a tag that already has a release, without
  # cutting a version. Pick the tag as the ref when starting the run.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "Tag $TAG, manifest $MANIFEST, package $PACKAGE: versions must match" >&2
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Verify no private material is bundled
        run: |
          if find extension -name '*.pem' -o -path 'extension/bookmarklets/private/*.js' | grep -q .; then
            echo "Refusing to package: private key or private bookmarklet present" >&2
            exit 1
          fi

      - name: Build store package
        run: |
          cd extension
          zip -r "../dow-${VERSION}.zip" . \
            -x 'dow-chrome-theme/*' -x 'dow-chrome-theme.zip' -x 'bookmarklets/private/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dow-${VERSION}.zip" \
            --title "Dow ${GITHUB_REF_NAME}" \
            --generate-notes

  # Safari cannot load a raw extension folder: it needs the extension wrapped in
  # a signed macOS app, and only Xcode can do that. This job builds that app on a
  # macOS runner and adds it to the release the job above created. The signature
  # is ad hoc, so the app is not notarised: see the install notes in the README.
  safari:
    needs: release
    if: ${{ always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "This job uploads to a release, so it has to run on a tag, not on $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the Safari flavour
        run: node scripts/build-safari.mjs

      - name: Verify the compatibility shim
        run: node scripts/test-safari-shim.mjs

      # The identifier has to be cased exactly like the app name. The converter
      # writes it verbatim on the extension target while the app target derives
      # its own from $(PRODUCT_NAME:rfc1034identifier), and Xcode rejects the
      # build if the extension identifier is not prefixed by the app one.
      - name: Convert to a Safari web extension project
        run: |
          xcrun safari-web-extension-converter dist/safari \
            --project-location build \
            --app-name Dow \
            --bundle-identifier com.infinition.Dow \
            --macos-only \
            --copy-resources \
            --no-open \
            --no-prompt \
            --force

      - name: Check the bundle identifiers agree
        run: |
          PROJECT=$(ls -d build/*/*.xcodeproj | head -1)
          IDS=$(grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PROJECT/project.pbxproj" \
            | sed 's/PRODUCT_BUNDLE_IDENTIFIER = //; s/;$//' \
            | sed 's/$(PRODUCT_NAME:rfc1034identifier)/Dow/g' \
            | sort -u)
          echo "$IDS"
          APP=$(echo "$IDS" | grep -v '\.Extension$' | head -1)
          EXTENSION=$(echo "$IDS" | grep '\.Extension$' | head -1)
          case "$EXTENSION" in
            "$APP".*) echo "Prefix rule satisfied: $EXTENSION under $APP" ;;
            *)
              echo "The extension identifier ($EXTENSION) must be prefixed with the app identifier ($APP)" >&2
              exit 1
              ;;
          esac

      - name: Build the app
        run: |
          PROJECT=$(ls -d build/*/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" -json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "Building $SCHEME from $PROJECT"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            build

      - name: Package the app
        run: |
          APP=$(ls -d out/*.app | head -1)
          if [ -z "$APP" ]; then
            echo "No app was produced" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "dow-${VERSION}-safari-macos.zip"

      - name: Add the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dow-${VERSION}-safari-macos.zip" --clobber
