name: CI & Extension Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Extension Script Syntax
        run: |
          node --check extension/background.js
          node --check extension/popup.js

      - name: Validate Chrome Extension Manifest V3
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('Manifest version must be 3');
            console.log('Manifest V3 Validated: ' + manifest.name + ' v' + manifest.version);
          "

      - name: Check Every Manifest Entry Point Exists
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            const refs = [manifest.background?.service_worker, manifest.action?.default_popup, manifest.side_panel?.default_path].filter(Boolean);
            for (const ref of refs) {
              const p = path.join('extension', ref);
              if (!fs.existsSync(p)) throw new Error('Manifest references a missing file: ' + ref);
            }
            console.log('Entry points present: ' + refs.join(', '));
          "

      # The Safari flavour is generated, so it can silently drift from the Chrome
      # source. Building it and running the shim scenarios on every push keeps
      # that from being discovered at tag time.
      - name: Verify the Safari build
        run: |
          node --check extension/compat/browser-compat.js
          node scripts/build-safari.mjs
          node scripts/test-safari-shim.mjs

      # Unversioned development build, kept out of Releases on purpose: Releases are
      # immutable and cut from a tag. Download this from the Actions run page to test
      # the current state of the branch, then load it unpacked.
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: dow-dev-${{ github.sha }}
          path: |
            extension
            !extension/dow-chrome-theme
            !extension/dow-chrome-theme.zip
            !extension/bookmarklets/private
          retention-days: 30
          if-no-files-found: error
